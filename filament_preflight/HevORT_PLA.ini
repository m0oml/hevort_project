[filament:HevORT PLA]
inherits                       = 
filament_type                  = PLA
filament_diameter              = 1.75
filament_vendor                = Generic
filament_density               = 1.24
filament_cost                  = 0
filament_soluble               = 0
temperature                    = 200
first_layer_temperature        = 200
bed_temperature                = 60
first_layer_bed_temperature    = 60
chamber_temperature            = 0
chamber_minimal_temperature    = 0
filament_max_volumetric_speed  = 16   ; Goliath is good for ~70, ceiling 55
min_fan_speed                  = 60
max_fan_speed                  = 100
bridge_fan_speed               = 100
disable_fan_first_layers       = 3
full_fan_speed_layer           = 0
slowdown_below_layer_time      = 3
fan_below_layer_time           = 30
min_print_speed                = 10
filament_retract_layer_change  = nil
compatible_printers            = 
compatible_printers_condition  = printer_notes=~/.*HevORT.*/
start_filament_gcode           = "; M207 not set here - retraction lives in config.g or add M207 above"
end_filament_gcode             = "; HevORT PLA end"
filament_notes                 = "STUB PRESET - the Orca source had only 16 keys (temps and fan). No flow ratio, no pressure advance, no diameter. Everything else here is a DEFAULT, not a measurement. Converted from Orca preset 'Saladfork PLA' 01/09/2026. Source was already 0.6mm RepRap so temps and flow transfer directly. CHECK BEFORE PRINTING: extrusion_multiplier came from Orca filament_flow_ratio and is a flow calibration, not a guess - reverify on this machine. Volumetric 16 is well under the Goliath's ~70; there may be speed available. Chamber value is the source preset's. NOTE the chamber heater assembly was REMOVED 31/08/2026 and a replacement is pending, so nothing will heat the chamber until it is back. Retraction is firmware G10/G11: set M207 in config.g or above."
