# =====================================================================
# HevORT - preFlight / PrusaSlicer-lineage PRINTER profile
# 0.6mm solid tungsten carbide nozzle
# Generated 01/09/2026 against config.g as of that date
#
# Import into preFlight via the PrusaSlicer profile import.
# PRINTER PROFILE ONLY - print and filament profiles are separate.
# =====================================================================

[printer:HevORT 0.6]
printer_technology       = FFF
printer_variant          = 0.6
inherits                 =

# --- Geometry -------------------------------------------------------
# M208 X0:400 Y0:400 Z-10:370. NOTE the frame is 415x415 but USABLE
# TRAVEL is the M208 limit, not the frame size. Do not raise to 415.
bed_shape                = 0x0,400x0,400x400,0x400
max_print_height         = 370
nozzle_diameter          = 0.6
extruder_offset          = 0x0
z_offset                 = 0

# --- Firmware -------------------------------------------------------
gcode_flavor             = reprapfirmware
use_relative_e_distances = 1
use_volumetric_e         = 0
use_firmware_retraction  = 1
remaining_times          = 0
silent_mode              = 0
single_extruder_multi_material = 0

# --- Machine limits -------------------------------------------------
# config.g OWNS these. Emitted nowhere; present so the slicer plans and
# estimates correctly. Mirror of config.g lines 55-57:
#   M201 X35000 Y35000 Z20 E250      (mm/s^2)
#   M203 X30000 Y30000 Z1000 E3600   (mm/min -> 500/500/16.67/60 mm/s)
#   M566 X900 Y900 Z12 E120          (mm/min -> 15/15/0.2/2 mm/s)
machine_limits_usage             = ignore
machine_max_acceleration_x       = 35000,35000
machine_max_acceleration_y       = 35000,35000
machine_max_acceleration_z       = 20,20
machine_max_acceleration_e       = 250,250
machine_max_feedrate_x           = 500,500
machine_max_feedrate_y           = 500,500
machine_max_feedrate_z           = 16.67,16.67
machine_max_feedrate_e           = 60,60
machine_max_jerk_x               = 15,15
machine_max_jerk_y               = 15,15
machine_max_jerk_z               = 0.2,0.2
machine_max_jerk_e               = 2,2
machine_max_acceleration_extruding = 20000,20000
machine_max_acceleration_retracting = 20000,20000
machine_max_acceleration_travel     = 30000,30000
machine_min_extruding_rate       = 0,0
machine_min_travel_rate          = 0,0

# --- Retraction -----------------------------------------------------
# FIRMWARE RETRACTION IS ON - G10/G11. These values are NOT used; the
# Duet's M207 is authoritative. WARNING: there is currently NO M207 in
# config.g, so G10 retracts ZERO until one is added. Set M207 (and M572
# for pressure advance) per filament, in the filament profile's custom
# start G-code, not here.
retract_length           = 0
retract_speed            = 40
deretract_speed          = 40
retract_restart_extra    = 0
retract_before_travel    = 2
retract_layer_change     = 1
retract_lift             = 0
retract_lift_above       = 0
retract_lift_below       = 0
wipe                     = 0

# --- Start G-code ---------------------------------------------------
# Slicer owns temperatures; printstart.g owns homing and the mesh.
# Heating is started without waiting, homing happens while it heats,
# then we wait - saves the homing time.
start_gcode = M104 S[first_layer_temperature] ; hotend, no wait\nM140 S[first_layer_bed_temperature] ; bed, no wait\nM98 P"0:/sys/printstart.g" ; home all + G29 S1 load heightmap\nM190 S[first_layer_bed_temperature] ; wait for bed\nM109 S[first_layer_temperature] ; wait for hotend\nG21 ; mm\nG90 ; absolute\nM83 ; relative extrusion\nG1 Z5 F1000\nG1 X10 Y10 F9000 ; move to prime start\nG1 Z0.35 F1000\nG1 X190 E13 F1200 ; prime line, 180mm (assumes 1.75mm filament)\nG1 X195 F9000 ; break off\nG92 E0

# --- End G-code -----------------------------------------------------
end_gcode = M104 S0 ; hotend off\nM140 S0 ; bed off\nM107 ; part cooling off\nM98 P"0:/sys/printend.g" ; lift, park at X0 Y0\nM84 ; motors off

# --- Other custom G-code --------------------------------------------
before_layer_gcode       = ;BEFORE_LAYER_CHANGE\n;[layer_z]
layer_gcode              = ;AFTER_LAYER_CHANGE\n;[layer_z]
between_objects_gcode    =
toolchange_gcode         =
pause_print_gcode        = M25
template_custom_gcode    =

# --- Thumbnails for DWC ---------------------------------------------
thumbnails               = 220x124

printer_notes = HevORT, Duet 3 6HC in SBC mode over USB, RRF 3.7.0-beta.3.\nCoreXY AWD, 4x M23CL closed loop on CAN 70-73, D4 tuned.\n\nTRAPS, from project.txt:\n- USABLE TRAVEL IS 400x400, NOT the 415 frame size. M208 owns it.\n- Z370 ALREADY ACCOUNTS FOR THE FR4 - it was set and driven with the\n  sheet in place, 29/08/2026. Do NOT subtract for it. Trev is being\n  conservative on Z anyway. Revisit only when the final granite goes\n  in, since that stack height may differ from the temporary one.\n- The ALPS probe is a strain gauge ON THE HOTEND: the nozzle IS the\n  probe, XY offset is X0 Y0 and that is CORRECT, not a placeholder.\n- Velocity ceiling is ~600-700 mm/s - audible resonance and the closed\n  loop saturates above that. Two unresolved modes: ~204Hz X beam\n  torsion, ~312Hz hotend mount. M593 P"zvd" F147 treats a third.\n- Goliath hotend is good for ~70 mm3/s. KEEP max_volumetric_speed AT\n  55 in the PRINT profile for headroom. Not a printer-profile field.\n- Tool 0 is M563 P0 D0 H1 F1, so plain M106 S<n> routes to the CPAP\n  part cooling fan automatically. Do not address a fan index.\n- Hotend limit M143 H1 S365. Bed limit M143 H0 S200.\n- Bed heater: the live M307 H0 model is CALCULATED for a 20mm granite\n  slab. Running it on the bare mat overshoots badly. Do not print with\n  bed heat until the granite is fitted and the RTD reads properly.\n- config.g is HAND EDITED. No M501, no config-override.g.
